<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Management System</h1>
        <p>Manage Your Student</p>
    </header>
    <main>
        <section><h2>Add New Student</h2>
        <form id="studentForm">
            <label for="">Student Name</label>
            <input type="text" id="name" placeholder="Enter Student Name">
            
            <label for="mobile"></label>
            <input type="number" id="mobile" placeholder="Enter Mobile Number">

            <label for="Email"></label>
            <input type="email" id="email" placeholder="Enter mail">
             
            <label for="">Department</label>
            <select name="" id="department">
                <option value="">Select Department</option>
                <option value="IT">IT</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Commerce">Commerce</option>
            </select>

            <label for="">Marks</label>
            <input type="number" id="marks" placeholder="Enter Marks">

            <button type="submit">Add Student</button>
        </form>
        <h1 id="demo" style="display: none;">please enter values</h1>
        </section>
<input type="text" id="searchInput" placeholder="Search student by name">
        <section><h2>Student Details</h2>

            <table border="1">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Marks</th>
                        <th>Action</th>
                        
                    </tr>
                </thead>

                <tbody id="studentList">
                </tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
